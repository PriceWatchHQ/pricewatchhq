name: Staging Health Check

on:
  push:
    branches:
      - staging

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Run health checks on staging
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Railway staging deploy
        run: |
          echo "Waiting 90s for Railway to deploy..."
          sleep 90

      - name: Run health checks
        run: node scripts/health-check.js "${{ secrets.STAGING_URL || 'https://innovative-curiosity-staging.up.railway.app' }}"

      - name: Run scraper regression tests
        run: |
          cd /home/runner/work/pricewatchhq/pricewatchhq
          npm install
          node --experimental-vm-modules scripts/scraper-tests.js
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        timeout-minutes: 10
        continue-on-error: true

      - name: Auto-merge to master if checks pass
        if: success()
        run: |
          git config user.name "Logan CI"
          git config user.email "ci@pricewatchhq.com"
          git checkout master
          git merge staging --no-ff --allow-unrelated-histories -m "ci: auto-merge staging -> master (health checks passed)"
          git push
          echo "Staging checks passed - merged to master"
