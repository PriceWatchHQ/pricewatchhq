name: Staging Health Check

on:
  push:
    branches:
      - staging

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: Run health checks on staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for Railway staging deploy
        run: |
          echo "Waiting 90s for Railway to deploy..."
          sleep 90

      - name: Run health checks
        env:
          STAGING_URL: ${{ secrets.STAGING_URL || 'https://innovative-curiosity-staging.up.railway.app' }}
        run: node scripts/health-check.js "$STAGING_URL"

      - name: Auto-merge to master if checks pass
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "Logan CI"
          git config user.email "ci@pricewatchhq.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/PriceWatchHQ/pricewatchhq.git
          git fetch origin master
          git checkout master
          git merge staging --no-ff --allow-unrelated-histories -m "ci: auto-merge staging → master (health checks passed)"
          git push origin master
          echo "✅ Staging checks passed — merged to master"
